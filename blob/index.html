<!DOCTYPE html>
<html lang="he" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <script src="alpine-combobox.js"></script>
    <title>Document</title>

    <style>
        table {
            border-collapse: collapse;
        }

        .id-col {
            visibility: collapse;
        }

        .name-col {
            width: 200px;
        }
    </style>
</head>

<body>

    <div x-data="{ 
            people: [
                { id: 1, name: 'Alice' },
                { id: 2, name: 'Bob' },
                { id: 3, name: 'Charlie' }
            ],
            form: { manager: null },
            init() {
                this.form.manager = this.people[0]; // בחר את אליס כברירת מחדל
            }
        }">

        <table>
            <template x-for="i in [1,2]" :key="i">
                <style x-text="`.col-${i} { display: ${i === 2 ? none : 'none'}; }`"></style>
            </template>
            <thead>
                <tr>
                    <th class="col-1">מזהה</th>
                    <th class="col-2">שם</th>
                </tr>
            </thead>
            <tbody>
                <template x-for="person in people" :key="person">
                    <tr>
                        <td class="col-1" x-text="person.id"></td>
                        <td class="col-2" x-text="person.name"></td>
                    </tr>
                </template>
            </tbody>
        </table>
    </div>

</body>

</html>
