<!DOCTYPE html>
<html lang="he" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <script src="alpine-combobox.js"></script>
    <title>Document</title>
</head>

<body>

    <div x-data="{ 
            people: [
                1,2,3
            ],
            form: { manager: null },
            init() {
                this.form.manager = this.people[0]; // בחר את אליס כברירת מחדל

                // after 3 seconds, change people list to simulate dynamic updates
                setTimeout(() => {
                    this.people = [
                        1,
                        2,
                        3,400,500,8807
                    ];
                }, 5000);
            }
        }">

        <!-- האלמנט נקשר ישירות ל-form.manager -->
        <alpine-combobox list="people" selected-item="form.manager" placeholder="בחר מנהל..." allow-custom>
        </alpine-combobox>

        <p x-text="`${people.length}${form.manager ? ` - ${form.manager}`: ''}`"></p>

        <!-- תוכל לראות שזה מתעדכן בזמן אמת! -->
        <p>מזהה המנהל הנבחר הוא: <strong x-text="form.manager"></strong></p>

        <!-- ואם תשנה את הערך פה, ה-Combobox יתעדכן ויציג 'אליס' אוטומטית! -->
        <button @click="form.manager = people[0]">בחר באליס מבחוץ</button>
    </div>

</body>

</html>
