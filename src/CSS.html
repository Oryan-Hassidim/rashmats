<style>
    /* import Assistant */
    @import url('https://fonts.googleapis.com/css2?family=Assistant:wght@200..800&display=swap');

    html {
        font-family: Assistant, sans-serif;
    }

    body {
        margin: 0;
        padding: 0;
    }

    nav {
        display: grid;
        grid-template-columns: 1fr auto;
        place-items: center start;
        background-color: hsl(208, 100%, 90%);
        padding: 0 1em;

        ul {
            display: flex;
            flex-direction: row;
            gap: 0;
            list-style-type: none;
            margin: 0;
            padding: 0;

            li {
                padding: 0.5em;
                cursor: pointer;

                &.active {
                    background-color: hsl(208, 100%, 80%);
                    font-weight: bold;
                }

                a {
                    text-decoration: none;
                    color: inherit;
                }
            }
        }
    }

    button {
        font-family: inherit;
        font-size: inherit;
        border-radius: .5em;
        border-width: 1px;
        padding: .2em .6em;
        cursor: pointer;

        &:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        &:hover:not(:disabled) {
            background-color: #c5c5c5;
        }
    }

    select,
    textarea,
    input[type="text"],
    input[type="number"] {
        width: 100%;
        box-sizing: border-box;
        border: 1px solid #d1d5db;
        outline: none;
        transition: border-color 0.2s, box-shadow 0.2s;
        background-color: #fff;
        color: #111827;
        font-family: inherit;
        font-size: inherit;
        padding: 0.5em 1em;
        border-radius: 1em;
        border-width: 1px;
    }

    main {
        padding: 1em;
    }

    .table-container {
        max-width: 100%;
        overflow: auto;

        table {
            border-collapse: collapse;

            th {
                position: sticky;
                top: 0;
                z-index: 2;
                padding: 0;
                height: 1px;
                background-color: hsl(208, 100%, 90%);

                div {
                    width: 15ch;
                    overflow: hidden;
                    resize: horizontal;
                    height: 100%;
                    display: grid;
                    place-items: end center;
                }
            }

            td {
                border: 1px solid #ddd;
                padding: 8px;
            }

            tr:nth-child(even) {
                background-color: #f2f2f2;
            }

            tr:hover {
                background-color: #ddd;
                /* Row hover effect */
            }

            .whatsapp-link {
                display: inline-block;
                width: 1em;
                height: 1em;
                background-image: url('https://www.svgrepo.com/show/473829/whatsapp.svg');
                background-size: contain;
            }

            th,
            td {
                overflow-x: hidden;
            }

            --backdrop-filter-blur: 5px;

            th:nth-child(1),
            td:nth-child(1) {
                position: sticky;
                right: 0;
                z-index: 1;
                background-color: #ffffff30;
                -webkit-backdrop-filter: blur(var(--backdrop-filter-blur));
                backdrop-filter: blur(var(--backdrop-filter-blur));
            }

            th:nth-child(2),
            td:nth-child(2) {
                position: sticky;
                right: var(--col1-header-size, 0);
                z-index: 1;
                background-color: #ffffff30;
                -webkit-backdrop-filter: blur(var(--backdrop-filter-blur));
                backdrop-filter: blur(var(--backdrop-filter-blur));
            }

            th:nth-child(3),
            td:nth-child(3) {
                position: sticky;
                right: calc(var(--col1-header-size, 0) + var(--col2-header-size, 0));
                z-index: 1;
                background-color: #ffffff30;
                -webkit-backdrop-filter: blur(var(--backdrop-filter-blur));
                backdrop-filter: blur(var(--backdrop-filter-blur));
            }

            th:nth-child(4),
            td:nth-child(4) {
                position: sticky;
                right: calc(var(--col1-header-size, 0) + var(--col2-header-size, 0) + var(--col3-header-size, 0));
                z-index: 1;
                background-color: #ffffff30;
                -webkit-backdrop-filter: blur(var(--backdrop-filter-blur));
                backdrop-filter: blur(var(--backdrop-filter-blur));
            }

            thead th:nth-child(1),
            thead th:nth-child(2),
            thead th:nth-child(3),
            thead th:nth-child(4) {
                z-index: 3;
                background-color: hsl(208, 100%, 90%);
            }
        }
    }

    .add-button {
        background-image: url(https://www.svgrepo.com/show/513803/add.svg);
        background-size: 1.2em;
        height: 1.5em;
        background-repeat: no-repeat;
        background-position: center;
    }

    .edit-button {
        background-image: url(https://www.svgrepo.com/show/501179/edit.svg);
        background-size: 1em;
        height: 1.5em;
        background-repeat: no-repeat;
        background-position: center;
        scale: -1 1;
    }

    .delete-button {
        background-image: url(https://www.svgrepo.com/show/488897/delete-2.svg);
        background-size: 1.2em;
        height: 1.5em;
        background-repeat: no-repeat;
        background-position: center;
    }

    .refresh-button {
        background-image: url(https://www.svgrepo.com/show/533702/refresh-cw-alt.svg);
        background-size: 1.2em;
        height: 1.5em;
        background-repeat: no-repeat;
        background-position: center;
    }

    input:focus {
        border-color: #3b82f6;
        box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.1);
    }

    dialog#edit-item-dialog {
        form {
            display: grid;
            grid-template-columns: repeat(3, minmax(15em, 1fr));
            grid-auto-rows: auto;
            column-gap: 2em;

            >* {
                display: grid;
                grid-row-end: span 2;
                grid-template-rows: subgrid;
                margin-bottom: 1em;

                /* last three */
                &:nth-last-child(-n+3) {
                    margin-bottom: 0;
                }
            }

            >div {
                grid-template-rows: auto;
            }

            .qualifications {
                display: grid;
                grid-template-areas:
                    "title title"
                    "list list"
                    "textbox add-button";
                grid-template-columns: 1fr auto;
                grid-template-rows: auto 1fr auto;
                place-items: stretch;

                strong {
                    grid-area: title;
                }

                ul {
                    grid-area: list;
                }

                alpline-combobox {
                    grid-area: textbox;
                }

                .add-button {
                    grid-area: add-button;
                }
            }

            >button {
                grid-row-end: span 2;
                place-self: end stretch;
            }
        }

    }
</style>
