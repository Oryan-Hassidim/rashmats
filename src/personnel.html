                <label>
                    שם פרטי:
                    <input name="firstName" type="text" x-model="selectedSoldier.firstName" required>

                <label>
                    שם משפחה:
                    <input name="lastName" type="text" x-model="selectedSoldier.lastName" required>
                </label>

                </label>
                <label>

                <label>
                    ציוד:

                        <div>מספר אישי</div>
                    </th>
                    <th>
                        <div>שם פרטי</div>
                    </th>
                    <th>
                        <div>שם משפחה</div>
                    </th>
                    <th>
                        <div>מס' נייד</div>
                    </th>
                    <th>
                        <div>מסגרת</div>

                        <div>תפקיד</div>

<script>

    /*
    
    *מסגרות*:
    - מזהה
    - שם
    - מזהה מפקד

    *כוח אדם*:
    - מזהה
    - שם פרטי
    - שם משפחה
    - מספר נייד
    - מזהה מסגרת
    - תפקיד
    - הסמכות
    - סטטוס
    - חולצת ב'※ציוד ב'※160
    - מכנסי ב'※ציוד ב'※160
    - כובע ב'※ציוד ב'※80
    - חגורה※ציוד ב'※80
    - שק"ש※ציוד ב'※100
    - ברכיות※תרומה※80

    *צל"ם*:
    - מזהה
    - סוג
    - שיוך
    - מיקום
    - קטגוריה
    - שינוי אחרון
    
    */

    function vm() {
        return {
            frames: [],
            equipmentHeaders: [],
            zelemHeaders: [],
            soldiers: [],
            zelem: [],
            selectedSoldier: {
                id: -1,
                name: '',
                rank: '',
                frame: null,
                qualifications: [],
                equipment: [],
                zelem: [],
            },
            newQualification: '',
            categories: {},
            roles: [],
            qualifications: [],
            ststuses: ['לא פעיל', 'פעיל', 'צו בבית', 'צו בבסיס'],

            loading: true,

            async init() {
                await this.updateData();
            },

            async updateData() {
                this.loading = true;
                try {
                    const [frames, soldiers, zelem] = await Promise.all([
                        server.getData('מסגרות'),
                        server.getData('כוח אדם'),
                        server.getData('צל"ם'),
                    ]);
                    this.frames = frames.slice(1).map(frame => {
                        return {
                            id: frame[0],
                            name: frame[1],
                        };
                    });
                    this.equipmentHeaders = soldiers[0].slice(8).map(h => {
                        const [name, category, standard] = h.split('※');
                        return {
                            name,
                            category,
                            standard,
                        };
                    });
                    this.soldiers = soldiers.slice(1).map(s => {
                        return {
                            id: s[0],
                            firstName: s[1],
                            lastName: s[2],
                            phone: s[3],
                            frame: s[4] ? this.frames.find(f => f.id === s[4]) || null : null,
                            role: s[5],
                            qualifications: s[6] ? s[6].split(',').filter(q => q) : [],
                            status: s[7],
                            equipment: this.equipmentHeaders.reduce((eq, header, index) => {
                                eq[header.name] = s[8 + index] || null;
                                return eq;
                            }, {}),
                            zelem: [],
                        };
                    });
                    const soldiersMap = this.soldiers.reduce((map, soldier) => {
                        map[soldier.id] = soldier;
                        return map;
                    }, {});
                    this.zelem = zelem.slice(1).map(z => {
                        return {
                            id: z[0],
                            type: z[1],
                            affiliation: z[2] ? soldiersMap[z[2]] : null,
                            location: z[3] ? (soldiersMap[z[3]] || z[3]) : null,
                            category: z[4],
                            lastChange: Date.parse(z[5]),
                        };
                    });
                    // append unique zelem types to headers, sorted by frequency
                    const uniqueTypes = [...new Set(this.zelem.map(z => z.type))];
                    uniqueTypes.sort((a, b) => {
                        const countA = this.zelem.filter(z => z.type === a).length;
                        const countB = this.zelem.filter(z => z.type === b).length;
                        return countB - countA;
                    });
                    this.zelemHeaders = uniqueTypes.map(type => {
                        return {
                            name: type,
                            category: this.zelem.find(z => z.type === type)?.category || 'ללא',
                        };
                    });
                    this.soldiers.forEach(soldier => {
                        soldier.zelem = this.zelem.filter(z => z.affiliation?.id === soldier.id);
                    });
                    this.categories = [...new Set(this.equipmentHeaders.map(h => h.category).concat(this.zelemHeaders.map(h => h.category)))].map(name => {
                        return {
                            name,
                            view: true,
                        };
                    }).reduce((map, category) => {
                        map[category.name] = category;
                        return map;
                    }, {});
                    this.roles = [...new Set(this.soldiers.map(s => s.role))].filter(r => r);
                    this.qualifications = [...new Set(this.soldiers.flatMap(s => s.qualifications))].filter(q => q);
                } catch (error) {
                    console.error('Error fetching data:', error);
                } finally {
                    console.log('Data loaded', this);
                    this.loading = false;
                }
            },

            get filteredSoldiers() {
                return this.soldiers;
            },

            edit(soldier) {
                this.selectedSoldier = {
                    id: soldier.id,
                    firstName: soldier.firstName,
                    lastName: soldier.lastName,
                    phone: soldier.phone,
                    frame: soldier.frame,
                    role: soldier.role,
                    qualifications: [...soldier.qualifications],
                    status: soldier.status,
                    equipment: { ...soldier.equipment },
                    zelem: [...soldier.zelem]
                };
                this.$refs.editSoldierDialog.showModal();
            },

            addSoldier() {
                this.selectedSoldier = {
                    id: -1,
                    name: '',
                    rank: '',
                    frame: null,
                    qualifications: [],
                    equipment: [],
                    zelem: []
                };
            },

            addQualification() {
                if (this.newQualification && !this.selectedSoldier.qualifications.includes(this.newQualification)) {
                    this.selectedSoldier.qualifications.push(this.newQualification);
                    this.newQualification = '';
                }
            },
        };
    }
</script>

</html>
