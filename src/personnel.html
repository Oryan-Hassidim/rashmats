                <label>
                    <strong>שם פרטי:</strong>
                    <input name="firstName" type="text" x-model="selectedSoldier.firstName" required minlength="2">

                    <strong>שם משפחה:</strong>

                </div>

                        <div>
                            <strong x-text="category.name + ':'"></strong>
                            <ul>
                                <template
                                    x-for="header in zelemHeaders.filter(h => h.category === category.name && selectedSoldier.zelem.some(z => z.type === h.name))"

                                        <strong x-text="header.name"></strong>:
                                        <div class="zelem-list">

                    <ul>
                        <template x-for="item in selectedSoldier.zelem" :key="item.id">
                            <li>
                                <strong x-text="item.type"></strong>: <span x-text="item.id"></span>

                    </ul> -->
                </div>
                <label>
                    <span>סטטוס:</span>

                        </th>

                        </th>
                        <th class="role-col">
                            <div>הסמכות</div>
                        </th>
                        <template x-for="(category, index) in equipmentCategories" :key="category.name">
                            <template x-for="header in equipmentHeaders.filter(h => h.category === category.name)"

<script>

    /*
    
    *מסגרות*:
    - מזהה
    - שם
    - מזהה מפקד

    *כוח אדם*:
    - מזהה
    - שם פרטי
    - שם משפחה
    - מספר נייד
    - מזהה מסגרת
    - תפקיד
    - הסמכות
    - סטטוס
    - חולצת ב'※ציוד ב'※160
    - מכנסי ב'※ציוד ב'※160
    - כובע ב'※ציוד ב'※80
    - חגורה※ציוד ב'※80
    - שק"ש※ציוד ב'※100
    - ברכיות※תרומה※80

    *צל"ם*:
    - מזהה
    - סוג
    - שיוך
    - מיקום
    - קטגוריה
    - שינוי אחרון
    
    */

    const [ID_STRING, FIRST_NAME_STRING, LAST_NAME_STRING, PHONE_STRING, FRAME_ID_STRING, ROLE_STRING, QUALIFICATIONS_STRING, STATUS_STRING]
        = ['מזהה', 'שם פרטי', 'שם משפחה', 'מספר נייד', 'מזהה מסגרת', 'תפקיד', 'הסמכות', 'סטטוס'];

    function vm() {
        return {
            frames: [],
            equipmentHeaders: [],
            zelemHeaders: [],
            soldiers: [],
            zelem: [],
            selectedSoldier: {
                oldId: -1,
                id: '',
                name: '',
                rank: '',
                frame: null,
                qualifications: [],
                equipment: [],
                zelem: [],
            },
            newQualification: '',
            equipmentCategories: [],
            zelemCategories: [],
            viewPersonnel: false,
            viewRole: false,
            roles: [],
            qualifications: [],
            ststuses: ['לא פעיל', 'פעיל', 'צו בבית', 'צו בבסיס'],

            view: {
                col1Width: 0,
                col2Width: 0,
                col3Width: 0,
            },
            loading: true,

            async init() {
                this.observer = new ResizeObserver(() => {
                    this.updateWidths();
                });

                // אומרים למאזין לעקוב אחרי האלמנטים ברגע שהם קיימים
                this.$nextTick(() => {
                    this.updateWidths(); // מדידה ראשונית
                    if (this.$refs.col1Header) this.observer.observe(this.$refs.col1Header);
                    if (this.$refs.col2Header) this.observer.observe(this.$refs.col2Header);
                    if (this.$refs.col3Header) this.observer.observe(this.$refs.col3Header);
                });
                await this.updateData();
            },

            updateWidths() {
                this.view.col1Width = this.$refs.col1Header?.parentElement.getBoundingClientRect().width || 0;
                this.view.col2Width = this.$refs.col2Header?.parentElement.getBoundingClientRect().width || 0;
                this.view.col3Width = this.$refs.col3Header?.parentElement.getBoundingClientRect().width || 0;
            },

            async updateData() {
                this.loading = true;
                try {
                    const [frames, soldiers, zelem] = await Promise.all([
                        server.getData('מסגרות'),
                        server.getData('כוח אדם'),
                        server.getData('צל"ם'),
                    ]);
                    this.frames = frames.slice(1).map(frame => {
                        return {
                            id: frame[0],
                            name: frame[1],
                        };
                    });
                    this.equipmentHeaders = soldiers[0].slice(8).map(h => {
                        const [name, category, standard] = h.split('※');
                        return {
                            name,
                            category,
                            standard,
                        };
                    });
                    this.soldiers = soldiers.slice(1).map(s => {
                        return {
                            id: String(s[0]),
                            firstName: s[1],
                            lastName: s[2],
                            phone: String(s[3]),
                            frame: s[4] ? this.frames.find(f => f.id === s[4]) || null : null,
                            role: s[5],
                            qualifications: s[6] ? s[6].split(',').filter(q => q) : [],
                            status: s[7],
                            equipment: this.equipmentHeaders.reduce((eq, header, index) => {
                                eq[header.name] = s[8 + index] || null;
                                return eq;
                            }, {}),
                            zelem: [],
                        };
                    });
                    const soldiersMap = this.soldiers.reduce((map, soldier) => {
                        map[soldier.id] = soldier;
                        return map;
                    }, {});
                    this.zelem = zelem.slice(1).map(z => {
                        return {
                            id: z[0],
                            type: z[1],
                            affiliation: z[2] ? soldiersMap[z[2]] : null,
                            location: z[3] ? (soldiersMap[z[3]] || z[3]) : null,
                            category: z[4],
                            lastChange: Date.parse(z[5]),
                        };
                    });
                    // append unique zelem types to headers, sorted by frequency
                    const uniqueTypes = [...new Set(this.zelem.map(z => z.type))];
                    uniqueTypes.sort((a, b) => {
                        const countA = this.zelem.filter(z => z.type === a).length;
                        const countB = this.zelem.filter(z => z.type === b).length;
                        return countB - countA;
                    });
                    this.zelemHeaders = uniqueTypes.map(type => {
                        return {
                            name: type,
                            category: this.zelem.find(z => z.type === type)?.category || 'ללא',
                        };
                    });
                    this.soldiers.forEach(soldier => {
                        soldier.zelem = this.zelem.filter(z => z.affiliation?.id === soldier.id);
                    });
                    this.equipmentCategories = [...new Set(this.equipmentHeaders.map(h => h.category))].map(name => {
                        return {
                            name,
                            view: false,
                        };
                    });
                    this.zelemCategories = [...new Set(this.zelemHeaders.map(h => h.category))].map(name => {
                        return {
                            name,
                            view: false,
                        };
                    });
                    this.roles = [...new Set(this.soldiers.map(s => s.role))].filter(r => r);
                    this.qualifications = [...new Set(this.soldiers.flatMap(s => s.qualifications))].filter(q => q);
                } catch (error) {
                    console.error('Error fetching data:', error);
                } finally {
                    console.log('Data loaded', this);
                    this.loading = false;
                }
            },

            get filteredSoldiers() {
                return this.soldiers;
            },

            editSoldier(soldier) {
                this.selectedSoldier = {
                    oldId: soldier.id,
                    id: soldier.id,
                    firstName: soldier.firstName,
                    lastName: soldier.lastName,
                    phone: soldier.phone,
                    frame: soldier.frame,
                    role: soldier.role,
                    qualifications: [...soldier.qualifications],
                    status: soldier.status,
                    equipment: { ...soldier.equipment },
                    zelem: [...soldier.zelem]
                };
                this.$refs.editSoldierDialog.showModal();
            },

            addSoldier() {
                this.selectedSoldier = {
                    oldId: '',
                    id: '',
                    firstName: '',
                    lastName: '',
                    phone: '',
                    frame: null,
                    role: '',
                    qualifications: [],
                    status: 'לא פעיל',
                    equipment: [],
                    zelem: []
                };
                this.$refs.editSoldierDialog.showModal();
            },

            async submitSoldier() {
                console.log('Submitting soldier:', this.selectedSoldier);
                this.loading = true;

                if (!this.selectedSoldier.oldId) {
                    try {
                        await server.appendRow('כוח אדם', [
                            "'" + String(this.selectedSoldier.id),
                            this.selectedSoldier.firstName,
                            this.selectedSoldier.lastName,
                            "'" + String(this.selectedSoldier.phone),
                            this.selectedSoldier.frame?.id || null,
                            this.selectedSoldier.role,
                            this.selectedSoldier.qualifications.join(','),
                            this.selectedSoldier.status,
                        ]);
                        await this.updateData();
                    } catch (error) {
                        console.error('Error adding soldier:', error);
                    } finally {
                        this.loading = false;
                    }
                } else {
                    try {
                        const update = [
                            this.selectedSoldier.oldId,
                            {
                                [ID_STRING]: "'" + String(this.selectedSoldier.id),
                                [FIRST_NAME_STRING]: this.selectedSoldier.firstName,
                                [LAST_NAME_STRING]: this.selectedSoldier.lastName,
                                [PHONE_STRING]: "'" + String(this.selectedSoldier.phone),
                                [FRAME_ID_STRING]: this.selectedSoldier.frame?.id || null,
                                [ROLE_STRING]: this.selectedSoldier.role,
                                [QUALIFICATIONS_STRING]: this.selectedSoldier.qualifications.join(','),
                                [STATUS_STRING]: this.selectedSoldier.status,
                            }
                        ];
                        console.log('Updating soldier with data:', JSON.stringify(update));
                        console.log('Edit rows result:', await server.editRows('כוח אדם', [update]));
                        await this.updateData();
                    } catch (error) {
                        console.error('Error updating soldier:', error);
                    } finally {
                        this.loading = false;
                    }
                }
                this.$refs.editSoldierDialog.close();
            },

            addQualification() {
                if (this.newQualification && !this.selectedSoldier.qualifications.includes(this.newQualification)) {
                    this.selectedSoldier.qualifications.push(this.newQualification);
                    this.newQualification = '';
                }
            },
        };
    }
</script>
